name: Datadog upstream V8

on:
  push:
    branches: ['julesdt/upstream-v8-stable']
  pull_request:
    paths:
      - 'tools/upstream_v8/**'
      - '.github/workflows/datadog-upstream-v8.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'libs/deno_v8/**'
      - 'libs/core/**'
      - 'ext/**'
      - '.cargo/config.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-v8-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.repository == 'DataDog/deno'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '8'
      DENO_NO_UPDATE_CHECK: '1'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Make room for the native build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld cmake ninja-build pkg-config libglib2.0-dev protobuf-compiler
      - name: Install pinned Rust
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621
      - name: Test source preparation
        run: python3 -m unittest discover -s tools/upstream_v8 -p '*_test.py'
      - name: Prepare pinned V8 and Rust bindings
        run: |
          python3 tools/upstream_v8/prepare.py --toolchains
          echo "LIBCLANG_PATH=$GITHUB_WORKSPACE/target/upstream-v8/rusty_v8/third_party/llvm-libclang/lib" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/target/upstream-v8/tools/gn" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/target/upstream-v8/tools/ninja" >> "$GITHUB_PATH"
      - name: Build Deno from source
        run: |
          cargo build --release --locked -p deno
          ./target/release/deno --version
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      - name: Test core against the rebuilt engine
        run: cargo test --release --locked -p deno_core --lib
      - name: Validate and package
        run: python3 tools/upstream_v8/verify.py
      - name: Upload Linux package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: deno-upstream-v8-linux-x86_64-${{ github.sha }}
          path: target/upstream-v8/package/
          if-no-files-found: error
          retention-days: 30
